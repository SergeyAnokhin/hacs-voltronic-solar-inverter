# PV power and energy on the ESP32 from the Hall string currents (needs
# packages/pv-string-current.yaml) and the PV input voltage, which Home Assistant
# passes to the ESP32. Read-only: it does not talk to the inverter at all.
#
# Add BOTH packages to your ESP32 config (copy this file next to the other one):
#
#   packages:
#     pv_current: !include packages/pv-string-current.yaml
#     pv_energy: !include packages/pv-string-energy.yaml
#
# What it does (details: docs/hall-current-sensors.md, "Power and energy on the ESP32"):
#   current  = sum of the two strings (Parallel) or their mean (Series); never below 0
#   power    = current x PV voltage                       -> W
#   energy   = power integrated every second               -> kWh: total, today,
#              this month; at midnight / at the new month the finished value goes
#              to "yesterday" / "last month" (ESPHome entities have no attributes,
#              so the Utility Meter `last_period` is a separate sensor)
# Counters are kept in RAM and saved by ESPHome (flash write interval, 1 min by default),
# so they survive reboots and OTA updates. Day / month need the clock (Home Assistant).
#
# When the inverter is wired to the same ESP32 (voltronic component), replace the
# `homeassistant` sensor below by the component's `pv_input_voltage` sensor given the
# id `pv_voltage`: nothing else changes.

substitutions:
  # Home Assistant entity with the PV input voltage in V. The live value
  # (`..._raw`) of the integration is the best one.
  pv_voltage_entity: sensor.vevor_inverter_pv_input_voltage_raw

sensor:
  # PV voltage from Home Assistant (internal: not shown again in Home Assistant).
  # "unknown" / "unavailable" there gives NaN here, and no power / energy is counted
  # meanwhile. If Home Assistant itself is unreachable the last voltage stays in use.
  - platform: homeassistant
    id: pv_voltage
    name: PV voltage from Home Assistant
    entity_id: ${pv_voltage_entity}
    internal: true

  # Owner's naming convention: "... raw" = mean over "PV raw send interval" (live
  # view, exclude *_raw from the recorder), plain name = mean over "PV smoothed
  # send interval". Both are means of the 1 s power values.
  - platform: template
    id: pv_power_raw
    name: PV strings power raw
    update_interval: never
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:solar-power

  - platform: template
    id: pv_power
    name: PV strings power
    update_interval: never
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:solar-power

  # Energies are sent every "PV energy send interval" (and at once at a day /
  # month change). Total, today and this month are total_increasing: Home Assistant
  # sees the drop to 0 as a new period and keeps the long-term statistics per day / month.
  - platform: template
    id: pv_energy_total
    name: PV strings energy total
    update_interval: never
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    icon: mdi:solar-power

  - platform: template
    id: pv_energy_today
    name: PV strings energy today
    update_interval: never
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:solar-power

  - platform: template
    id: pv_energy_month
    name: PV strings energy this month
    update_interval: never
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:solar-power

  # Finished periods ("last value"). No state_class: they are not counters.
  - platform: template
    id: pv_energy_yesterday
    name: PV strings energy yesterday
    update_interval: never
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 2
    icon: mdi:solar-power

  - platform: template
    id: pv_energy_last_month
    name: PV strings energy last month
    update_interval: never
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 2
    icon: mdi:solar-power

# How often the energies are sent to Home Assistant. The counting itself runs every
# second whatever this is, so a longer interval only makes the displayed value
# change less often, the accuracy does not change. Day / month changes are sent at once.
number:
  - platform: template
    id: pv_energy_interval
    name: PV energy send interval
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 300

# How the two strings are wired. Settable from Home Assistant (UI or automation),
# kept over reboots.
select:
  - platform: template
    id: pv_strings_connection
    name: PV strings connection
    entity_category: config
    options:
      - "Parallel"   # the inverter sees I1 + I2: currents are added
      - "Series"     # one current flows through both: the mean of the two sensors
    initial_option: "Parallel"
    optimistic: true
    restore_value: true

globals:
  # Counters, restored after a reboot. Doubles: a float would lose Wh resolution.
  - id: pe_total
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: pe_day
    type: double
    restore_value: true
    initial_value: "0.0"
  - id: pe_month
    type: double
    restore_value: true
    initial_value: "0.0"
  # Finished periods; -1 = no period has ended yet (nothing to show).
  - id: pe_last_day
    type: double
    restore_value: true
    initial_value: "-1.0"
  - id: pe_last_month
    type: double
    restore_value: true
    initial_value: "-1.0"
  # Which day / month the counters belong to (yyyymmdd / yyyymm); 0 = unknown.
  - id: pe_day_key
    type: int
    restore_value: true
    initial_value: "0"
  - id: pe_month_key
    type: int
    restore_value: true
    initial_value: "0"
  # Runtime only.
  - id: pe_ms          # millis() of the last tick, 0 = none yet
    type: uint32_t
  - id: pe_pub_ms      # millis() of the last periodic energy publish
    type: uint32_t
  - id: pe_force       # publish everything at the next opportunity (boot, day / month change)
    type: bool
    initial_value: "true"
  - id: pw_sum         # power accumulators: [0] raw, [1] smoothed
    type: double[2]
  - id: pw_n
    type: int[2]
  - id: pw_last        # millis() of the last power publish: [0] raw, [1] smoothed
    type: uint32_t[2]

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          auto pub = [](sensor::Sensor *s, float v, float k) {
            if (isnan(v)) {
              if (!isnan(s->state)) s->publish_state(NAN);
              return;
            }
            float r = roundf(v * k) / k;
            if (r == 0.0f) r = 0.0f;  // no "-0"
            if (isnan(s->state) || s->state != r) s->publish_state(r);
          };

          // 1. Power of this second: effective current x PV voltage.
          float p = NAN;
          const float u = id(pv_voltage).state;
          if (id(pv_i_now_ms) != 0 && now - id(pv_i_now_ms) <= 3000 && !isnan(u)) {
            const float i1 = id(pv_i_now)[0];
            const float i2 = id(pv_i_now)[1];
            // select index: 0 = Parallel (add), 1 = Series (mean)
            float i = (id(pv_strings_connection).active_index().value_or(0) == 1) ? (i1 + i2) / 2.0f : i1 + i2;
            p = (i > 0.0f ? i : 0.0f) * (u > 0.0f ? u : 0.0f);
          }

          // 2. New day / month (needs the clock): the finished value becomes "last".
          auto t = id(pv_calib_time).now();
          if (t.is_valid()) {
            const int dkey = t.year * 10000 + t.month * 100 + t.day_of_month;
            const int mkey = t.year * 100 + t.month;
            // key 0 = first start ever: just adopt the date, keep what was counted so far
            if (id(pe_day_key) != dkey) {
              if (id(pe_day_key) != 0) {
                id(pe_last_day) = id(pe_day);
                id(pe_day) = 0.0;
              }
              id(pe_day_key) = dkey;
              id(pe_force) = true;
            }
            if (id(pe_month_key) != mkey) {
              if (id(pe_month_key) != 0) {
                id(pe_last_month) = id(pe_month);
                id(pe_month) = 0.0;
              }
              id(pe_month_key) = mkey;
              id(pe_force) = true;
            }
          }

          // 3. Energy of the time since the last tick (a gap > 5 s adds nothing).
          const uint32_t dt = id(pe_ms) == 0 ? 0 : now - id(pe_ms);
          id(pe_ms) = now;
          if (!isnan(p) && dt > 0 && dt <= 5000) {
            const double kwh = (double) p * dt / 3.6e9;  // W x ms -> kWh
            id(pe_total) += kwh;
            id(pe_day) += kwh;
            id(pe_month) += kwh;
          }

          // 4. Power: means over the two send intervals (shared with the currents).
          if (!isnan(p)) {
            for (int k = 0; k < 2; k++) {
              id(pw_sum)[k] += p;
              id(pw_n)[k]++;
            }
          }
          float raw_s = id(pv_raw_interval).state;
          float avg_s = id(pv_avg_interval).state;
          if (isnan(raw_s) || raw_s < 1.0f) raw_s = 1.0f;
          if (isnan(avg_s) || avg_s < 1.0f) avg_s = 1.0f;
          float e_s = id(pv_energy_interval).state;
          if (isnan(e_s) || e_s < 10.0f) e_s = 10.0f;
          if (now - id(pw_last)[0] >= (uint32_t) (raw_s * 1000.0f)) {
            id(pw_last)[0] = now;
            pub(id(pv_power_raw), id(pw_n)[0] > 0 ? (float) (id(pw_sum)[0] / id(pw_n)[0]) : NAN, 1.0f);
            id(pw_sum)[0] = 0.0;
            id(pw_n)[0] = 0;
          }
          if (now - id(pw_last)[1] >= (uint32_t) (avg_s * 1000.0f)) {
            id(pw_last)[1] = now;
            pub(id(pv_power), id(pw_n)[1] > 0 ? (float) (id(pw_sum)[1] / id(pw_n)[1]) : NAN, 1.0f);
            id(pw_sum)[1] = 0.0;
            id(pw_n)[1] = 0;
          }

          // 5. Energies: every "PV energy send interval" (default 5 min), and everything at boot / a day or
          //    month change. After a boot wait for the clock (at most 2 min) so that
          //    a stale "today" is not shown after midnight.
          const bool ready = t.is_valid() || now > 120000;
          if (id(pe_force) ? ready : (now - id(pe_pub_ms) >= (uint32_t) (e_s * 1000.0f))) {
            id(pe_pub_ms) = now;
            pub(id(pv_energy_total), (float) id(pe_total), 1000.0f);
            pub(id(pv_energy_today), (float) id(pe_day), 100.0f);
            pub(id(pv_energy_month), (float) id(pe_month), 100.0f);
            if (id(pe_force)) {
              id(pe_force) = false;
              if (id(pe_last_day) >= 0.0) pub(id(pv_energy_yesterday), (float) id(pe_last_day), 100.0f);
              if (id(pe_last_month) >= 0.0) pub(id(pv_energy_last_month), (float) id(pe_last_month), 100.0f);
            }
          }
