# Two Hall-effect current sensors (QNHCK2-16, 30 A, 3.3 V supply) on the PV+
# cables of the two PV strings, read through an ADS1115 16-bit ADC on I2C.
# Read-only: it does not talk to the inverter at all.
#
# Add it to vevor-bridge.yaml, vevor-inverter.yaml or any ESP32 config (copy
# this file to /config/esphome/packages/, or use a git "url:" package):
#
#   packages:
#     pv_current: !include packages/pv-string-current.yaml
#
# Wiring, zero calibration and Home Assistant use: docs/hall-current-sensors.md
#
# ADS1115 inputs: A0 = sensor 1 OUT, A1 = sensor 2 OUT, A2 = the 3.3 V supply.
# Current = (OUT - supply / 2) / (sensitivity * supply / 3.3 V): the sensor is
# assumed ratiometric (1.65 V = half of 3.3 V), so A2 corrects for a supply
# that is not exactly 3.3 V.

substitutions:
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO22
  # 0.625 V per 30 A at 3.3 V supply (sensor label "30A 1.65V 0.625V PWR3.3V").
  hall_sensitivity: "0.0208333"  # V per A
  # Initial MANUAL zero calibration in A (used only until a value is set in Home
  # Assistant; afterwards the "zero trim" number entities are stored on the ESP).
  # Which zero is used is chosen with the select "PV zero calibration source".
  string1_zero_trim: "0.0"
  string2_zero_trim: "0.0"
  # How often values are sent to Home Assistant (readings are taken every
  # 250 ms and averaged over the interval). avg_send_interval >= raw_send_interval.
  raw_send_interval: 1s   # "... current raw" sensors
  avg_send_interval: 60s  # smoothed "... current" sensors
  # Automatic night zero calibration (runs on the ESP). The hours are local
  # time of Home Assistant and are only the initial values of the numbers
  # "PV zero calibration start hour" / "... end hour".
  calib_start_hour: "2"
  calib_end_hour: "4"
  # Safety: the night mean is NOT stored when |mean| > calib_max_offset (A) or
  # when max - min of the 5 s values in the window > calib_max_spread (A)
  # (some current is flowing, e.g. dawn) or when fewer than 60 values exist.
  calib_max_offset: "1.0"
  calib_max_spread: "0.6"

i2c:
  id: i2c_hall
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 400kHz

ads1115:
  - id: ads_hall
    address: 0x48  # ADDR pin to GND

sensor:
  # Sensor supply on A2, used for the ratiometric correction.
  - platform: ads1115
    ads1115_id: ads_hall
    id: hall_supply
    name: Hall sensor supply
    multiplexer: A2_GND
    gain: 4.096
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 1s
    filters:
      # 10 s mean: the supply is stable, no need to send it every second.
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10

  # Owner's naming convention: "<name> raw" = short mean (raw_send_interval, for
  # the live view; exclude *_raw from the recorder), plain name = longer mean
  # (avg_send_interval) with negative values shown as 0.
  - platform: ads1115
    ads1115_id: ads_hall
    id: pv_string1_current_raw
    name: PV string 1 current raw
    multiplexer: A0_GND
    gain: 4.096
    update_interval: 250ms
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          const float vs = id(hall_supply).state;
          if (isnan(vs) || vs < 3.0f) return {};
          // zero source: 0 = off, 1 = night (automatic), 2 = manual
          float trim = 0.0f;
          const size_t zmode = id(pv_zero_source).active_index().value_or(2);
          if (zmode == 1) trim = id(pv_string1_night_trim).state;
          else if (zmode == 2) trim = id(pv_string1_zero_trim).state;
          if (isnan(trim)) trim = 0.0f;
          return (x - vs / 2.0f) / (${hall_sensitivity} * vs / 3.3f) + trim;
      - throttle_average: ${raw_send_interval}
      - round: 1

  - platform: ads1115
    ads1115_id: ads_hall
    id: pv_string2_current_raw
    name: PV string 2 current raw
    multiplexer: A1_GND
    gain: 4.096
    update_interval: 250ms
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          const float vs = id(hall_supply).state;
          if (isnan(vs) || vs < 3.0f) return {};
          // zero source: 0 = off, 1 = night (automatic), 2 = manual
          float trim = 0.0f;
          const size_t zmode = id(pv_zero_source).active_index().value_or(2);
          if (zmode == 1) trim = id(pv_string2_night_trim).state;
          else if (zmode == 2) trim = id(pv_string2_zero_trim).state;
          if (isnan(trim)) trim = 0.0f;
          return (x - vs / 2.0f) / (${hall_sensitivity} * vs / 3.3f) + trim;
      - throttle_average: ${raw_send_interval}
      - round: 1

  # Calibration sensors: the same measurement WITHOUT the zero trim and with
  # two decimals. With no current through the sensor the mean of this value is
  # the offset to enter (with a minus) in the "zero trim" number. Exclude *_raw
  # from the recorder, see docs/hall-current-sensors.md (night calibration).
  - platform: ads1115
    ads1115_id: ads_hall
    id: pv_string1_current_calibration_raw
    name: PV string 1 current calibration raw
    multiplexer: A0_GND
    gain: 4.096
    update_interval: 250ms
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - lambda: |-
          const float vs = id(hall_supply).state;
          if (isnan(vs) || vs < 3.0f) return {};
          return (x - vs / 2.0f) / (${hall_sensitivity} * vs / 3.3f);
      - throttle_average: ${raw_send_interval}
      - round: 2
    on_value:
      then:
        - lambda: |-
            if (!id(calib_active)) return;
            id(calib_sum)[0] += x;
            id(calib_n)[0]++;
            if (x < id(calib_min)[0]) id(calib_min)[0] = x;
            if (x > id(calib_max)[0]) id(calib_max)[0] = x;

  - platform: ads1115
    ads1115_id: ads_hall
    id: pv_string2_current_calibration_raw
    name: PV string 2 current calibration raw
    multiplexer: A1_GND
    gain: 4.096
    update_interval: 250ms
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - lambda: |-
          const float vs = id(hall_supply).state;
          if (isnan(vs) || vs < 3.0f) return {};
          return (x - vs / 2.0f) / (${hall_sensitivity} * vs / 3.3f);
      - throttle_average: ${raw_send_interval}
      - round: 2
    on_value:
      then:
        - lambda: |-
            if (!id(calib_active)) return;
            id(calib_sum)[1] += x;
            id(calib_n)[1]++;
            if (x < id(calib_min)[1]) id(calib_min)[1] = x;
            if (x > id(calib_max)[1]) id(calib_max)[1] = x;

  # Average first, clamp after: clipping single samples would bias the mean
  # upwards around 0 A. The raw sensors stay signed (zero calibration, sensor
  # direction check).
  - platform: copy
    source_id: pv_string1_current_raw
    name: PV string 1 current
    accuracy_decimals: 1
    filters:
      - throttle_average: ${avg_send_interval}
      - lambda: |-
          if (x < 0.0f) return 0.0f;
          return x;
      - round: 1

  - platform: copy
    source_id: pv_string2_current_raw
    name: PV string 2 current
    accuracy_decimals: 1
    filters:
      - throttle_average: ${avg_send_interval}
      - lambda: |-
          if (x < 0.0f) return 0.0f;
          return x;
      - round: 1

# MANUAL zero calibration in A, added to the current when the source is
# "Manual": with no current through the sensor, set it to minus the reading.
# Editable from Home Assistant; kept across reboots on the ESP.
number:
  - platform: template
    id: pv_string1_zero_trim
    name: PV string 1 zero trim
    entity_category: config
    unit_of_measurement: A
    device_class: current
    min_value: -3.0
    max_value: 3.0
    step: 0.01
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${string1_zero_trim}

  - platform: template
    id: pv_string2_zero_trim
    name: PV string 2 zero trim
    entity_category: config
    unit_of_measurement: A
    device_class: current
    min_value: -3.0
    max_value: 3.0
    step: 0.01
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${string2_zero_trim}

  # NIGHT zero calibration in A, written by the automatic night calibration
  # (below), used when the source is "Night (automatic)". It can be edited too.
  - platform: template
    id: pv_string1_night_trim
    name: PV string 1 night zero trim
    entity_category: config
    unit_of_measurement: A
    device_class: current
    min_value: -3.0
    max_value: 3.0
    step: 0.01
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0

  - platform: template
    id: pv_string2_night_trim
    name: PV string 2 night zero trim
    entity_category: config
    unit_of_measurement: A
    device_class: current
    min_value: -3.0
    max_value: 3.0
    step: 0.01
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0

  # Window of the automatic night calibration (local time, whole hours; may
  # wrap over midnight, e.g. 23 -> 3).
  - platform: template
    id: pv_calib_start_hour
    name: PV zero calibration start hour
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${calib_start_hour}

  - platform: template
    id: pv_calib_end_hour
    name: PV zero calibration end hour
    entity_category: config
    unit_of_measurement: h
    min_value: 0
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${calib_end_hour}

# Which zero is added to the current: nothing, the night value or the manual one.
# The night values are computed every night whatever is selected here.
select:
  - platform: template
    id: pv_zero_source
    name: PV zero calibration source
    entity_category: config
    options:
      - "Off"
      - "Night (automatic)"
      - "Manual"
    initial_option: "Manual"
    optimistic: true
    restore_value: true

text_sensor:
  - platform: template
    id: pv_calib_status
    name: PV zero calibration status
    entity_category: diagnostic

# Local time for the calibration window (taken from Home Assistant, including
# its time zone). If your main file already has a time component, this one is
# an additional one with its own id.
time:
  - platform: homeassistant
    id: pv_calib_time

# Night zero calibration on the ESP: during the window the 5 s values of the
# "... calibration raw" sensors (no trim) are collected; when the window ends
# the means, if plausible (no current flowing), are written to the night zero
# trim numbers (trim = minus the mean). The result is in "PV zero calibration
# status". Whether they are used depends on the select "PV zero calibration source".
globals:
  - id: calib_active
    type: bool
    initial_value: "false"
  - id: calib_sum
    type: double[2]
  - id: calib_n
    type: int[2]
  - id: calib_min
    type: float[2]
  - id: calib_max
    type: float[2]

interval:
  - interval: 60s
    then:
      - lambda: |-
          auto t = id(pv_calib_time).now();
          if (!t.is_valid()) return;
          const float h = t.hour + t.minute / 60.0f;
          const float s = id(pv_calib_start_hour).state;
          const float e = id(pv_calib_end_hour).state;
          if (isnan(s) || isnan(e) || s == e) return;
          const bool in_window = (s < e) ? (h >= s && h < e) : (h >= s || h < e);
          if (in_window && !id(calib_active)) {
            for (int i = 0; i < 2; i++) {
              id(calib_sum)[i] = 0.0;
              id(calib_n)[i] = 0;
              id(calib_min)[i] = 1000.0f;
              id(calib_max)[i] = -1000.0f;
            }
            id(calib_active) = true;
            ESP_LOGI("pv_calib", "night zero calibration window started");
          } else if (!in_window && id(calib_active)) {
            id(calib_active) = false;
            char msg[256];
            int len = snprintf(msg, sizeof(msg), "%02d:%02d", t.hour, t.minute);
            for (int i = 0; i < 2; i++) {
              const int n = id(calib_n)[i];
              const float mean = n > 0 ? (float) (id(calib_sum)[i] / n) : NAN;
              const float spread = id(calib_max)[i] - id(calib_min)[i];
              const char *res;
              if (n < 60) {
                res = "too few values";
              } else if (fabsf(mean) > ${calib_max_offset}) {
                res = "offset too large";
              } else if (spread > ${calib_max_spread}) {
                res = "unstable";
              } else {
                const float trim = roundf(-mean * 100.0f) / 100.0f;
                if (i == 0)
                  id(pv_string1_night_trim).make_call().set_value(trim).perform();
                else
                  id(pv_string2_night_trim).make_call().set_value(trim).perform();
                res = "stored";
              }
              len += snprintf(msg + len, sizeof(msg) - len, " | string %d: %s, mean %.2f A, n=%d, spread %.2f A",
                              i + 1, res, mean, n, spread);
            }
            ESP_LOGI("pv_calib", "%s", msg);
            id(pv_calib_status).publish_state(msg);
          }
