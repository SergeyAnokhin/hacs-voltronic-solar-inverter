  - platform: template
    name: Return to default screen (P19)
    icon: mdi:monitor
    lambda: return id(flag_lcd_default).state;
    turn_on_action: [lambda: 'id(inverter0).queue_command("PEk");']
    turn_off_action: [lambda: 'id(inverter0).queue_command("PDk");']
  - platform: template
    name: Beep on source loss (P22)
    icon: mdi:bell-alert
    lambda: return id(flag_source_beep).state;
    turn_on_action: [lambda: 'id(inverter0).queue_command("PEy");']
    turn_off_action: [lambda: 'id(inverter0).queue_command("PDy");']
  - platform: template
    name: Record fault codes (P25)
    icon: mdi:history
    lambda: return id(flag_fault_record).state;
    turn_on_action: [lambda: 'id(inverter0).queue_command("PEz");']
    turn_off_action: [lambda: 'id(inverter0).queue_command("PDz");']
