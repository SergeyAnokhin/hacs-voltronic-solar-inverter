<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="700" rx="12" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#212121">ESP32 + MAX3232 on the RS232 port of the Vevor GD5548JMH</text>

  <!-- voltage zones -->
  <rect x="14" y="60" width="586" height="470" rx="10" fill="#fdecea" stroke="#e57373" stroke-dasharray="6 4"/>
  <text x="28" y="84" font-size="14" font-weight="700" fill="#c62828">RS232 levels: about ±5…12 V. Never connect these wires to ESP32 pins!</text>
  <rect x="600" y="60" width="486" height="470" rx="10" fill="#e8f4fd" stroke="#64b5f6" stroke-dasharray="6 4"/>
  <text x="1072" y="84" text-anchor="end" font-size="14" font-weight="700" fill="#1565c0">3.3 V logic (UART)</text>

  <!-- inverter -->
  <rect x="30" y="120" width="180" height="320" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="120" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Inverter</text>
  <text x="120" y="170" text-anchor="middle" font-size="12" fill="#455a64">Vevor GD5548JMH</text>
  <text x="120" y="186" text-anchor="middle" font-size="12" fill="#455a64">(VMII-4000, 24 V)</text>
  <rect x="60" y="205" width="120" height="70" rx="6" fill="#cfd8dc" stroke="#455a64"/>
  <text x="120" y="232" text-anchor="middle" font-size="12" fill="#263238">LCD / buttons</text>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#546e7a">(bottom side:</text>
  <text x="120" y="264" text-anchor="middle" font-size="11" fill="#546e7a">communication ports)</text>
  <!-- RS232 port -->
  <rect x="180" y="300" width="44" height="44" rx="4" fill="#37474f" stroke="#263238"/>
  <rect x="188" y="308" width="28" height="22" fill="#90a4ae"/>
  <text x="120" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">RS232</text>
  <text x="120" y="335" text-anchor="middle" font-size="11" fill="#2e7d32">(RJ45) ✔ use</text>
  <!-- BMS port -->
  <rect x="180" y="370" width="44" height="44" rx="4" fill="#9e9e9e" stroke="#616161"/>
  <line x1="182" y1="372" x2="222" y2="412" stroke="#c62828" stroke-width="3"/>
  <line x1="222" y1="372" x2="182" y2="412" stroke="#c62828" stroke-width="3"/>
  <text x="120" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">BMS / RS485</text>
  <text x="120" y="405" text-anchor="middle" font-size="11" fill="#c62828">(RJ45) ✘ not this</text>

  <!-- cable -->
  <path d="M224,322 C260,322 270,280 300,280" fill="none" stroke="#78909c" stroke-width="12" stroke-linecap="round"/>
  <text x="262" y="356" text-anchor="middle" font-size="11" fill="#455a64">patch cable</text>

  <!-- breakout -->
  <rect x="300" y="180" width="110" height="200" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="355" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#5d4037">RJ45 breakout</text>
  <text x="355" y="214" text-anchor="middle" font-size="10" fill="#6d4c41">or cut cable</text>
  <text x="402" y="244" text-anchor="end" font-size="12" fill="#2e7d32" font-weight="700">inverter TX</text>
  <text x="402" y="304" text-anchor="end" font-size="12" fill="#ef6c00" font-weight="700">inverter RX</text>
  <text x="402" y="364" text-anchor="end" font-size="12" fill="#212121" font-weight="700">GND</text>
  <text x="355" y="395" text-anchor="middle" font-size="10" fill="#6d4c41">pin numbers: figure 2</text>
  <circle cx="410" cy="240" r="5" fill="#2e7d32"/>
  <circle cx="410" cy="300" r="5" fill="#ef6c00"/>
  <circle cx="410" cy="360" r="5" fill="#212121"/>

  <!-- MAX3232 module -->
  <rect x="490" y="160" width="220" height="250" rx="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="600" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">MAX3232 module</text>
  <rect x="565" y="250" width="70" height="60" rx="4" fill="#212121"/>
  <text x="600" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">MAX3232</text>
  <text x="600" y="400" text-anchor="middle" font-size="11" fill="#bbdefb">RS232 side ◀ │ ▶ TTL side</text>
  <!-- RS232 side pins -->
  <circle cx="490" cy="240" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="490" cy="300" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="490" cy="360" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <text x="502" y="236" font-size="12" font-weight="700" fill="#ffffff">R1IN</text>
  <text x="502" y="250" font-size="10" fill="#bbdefb">DB9 pin 3*</text>
  <text x="502" y="296" font-size="12" font-weight="700" fill="#ffffff">T1OUT</text>
  <text x="502" y="310" font-size="10" fill="#bbdefb">DB9 pin 2*</text>
  <text x="502" y="356" font-size="12" font-weight="700" fill="#ffffff">GND</text>
  <text x="502" y="370" font-size="10" fill="#bbdefb">DB9 pin 5</text>
  <!-- TTL side pins -->
  <circle cx="710" cy="200" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="710" cy="250" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="710" cy="300" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="710" cy="350" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <text x="698" y="204" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">VCC</text>
  <text x="698" y="254" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">GND</text>
  <text x="698" y="300" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">TXD</text>
  <text x="698" y="313" text-anchor="end" font-size="10" fill="#bbdefb">(T1IN)</text>
  <text x="698" y="350" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">RXD</text>
  <text x="698" y="363" text-anchor="end" font-size="10" fill="#bbdefb">(R1OUT)</text>

  <!-- RS232 wires -->
  <line x1="415" y1="240" x2="482" y2="240" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrG)"/>
  <line x1="482" y1="300" x2="417" y2="300" stroke="#ef6c00" stroke-width="4" marker-end="url(#arrO)"/>
  <line x1="410" y1="360" x2="484" y2="360" stroke="#212121" stroke-width="4"/>

  <!-- ESP32 -->
  <rect x="860" y="150" width="200" height="290" rx="10" fill="#263238" stroke="#000000" stroke-width="2"/>
  <rect x="915" y="165" width="90" height="60" rx="4" fill="#90a4ae"/>
  <text x="960" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">ESP-WROOM-32</text>
  <text x="985" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32 DevKit</text>
  <circle cx="860" cy="200" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="860" cy="250" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="860" cy="300" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <circle cx="860" cy="350" r="6" fill="#ffd54f" stroke="#5d4037"/>
  <text x="872" y="204" font-size="12" font-weight="700" fill="#ffffff">3V3</text>
  <text x="872" y="254" font-size="12" font-weight="700" fill="#ffffff">GND</text>
  <text x="872" y="304" font-size="12" font-weight="700" fill="#ffffff">GPIO17 (TX)</text>
  <text x="872" y="354" font-size="12" font-weight="700" fill="#ffffff">GPIO16 (RX)</text>
  <rect x="935" y="425" width="50" height="22" rx="3" fill="#b0bec5" stroke="#455a64"/>
  <text x="960" y="441" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">USB</text>

  <!-- TTL wires -->
  <line x1="716" y1="200" x2="854" y2="200" stroke="#d32f2f" stroke-width="4"/>
  <line x1="716" y1="250" x2="854" y2="250" stroke="#212121" stroke-width="4"/>
  <line x1="852" y1="300" x2="718" y2="300" stroke="#ef6c00" stroke-width="4" marker-end="url(#arrO)"/>
  <line x1="718" y1="350" x2="852" y2="350" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrG)"/>

  <!-- Wi-Fi -->
  <path d="M940,128 Q960,110 980,128" fill="none" stroke="#1565c0" stroke-width="3"/>
  <path d="M932,120 Q960,96 988,120" fill="none" stroke="#1565c0" stroke-width="3"/>
  <circle cx="960" cy="136" r="4" fill="#1565c0"/>
  <text x="960" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">Wi-Fi → Home Assistant</text>

  <!-- USB power -->
  <line x1="960" y1="447" x2="960" y2="490" stroke="#757575" stroke-width="5"/>
  <rect x="890" y="490" width="140" height="34" rx="6" fill="#fafafa" stroke="#757575"/>
  <text x="960" y="512" text-anchor="middle" font-size="12" fill="#424242">5 V USB charger</text>

  <!-- legend -->
  <rect x="14" y="545" width="1072" height="140" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="30" y="570" font-size="14" font-weight="700" fill="#212121">Legend</text>
  <line x1="30" y1="592" x2="80" y2="592" stroke="#d32f2f" stroke-width="4"/>
  <text x="90" y="597" font-size="13" fill="#212121">3.3 V power for the module (ESP32 3V3 → VCC). Do NOT use 5 V.</text>
  <line x1="30" y1="616" x2="80" y2="616" stroke="#212121" stroke-width="4"/>
  <text x="90" y="621" font-size="13" fill="#212121">Ground: inverter GND, module GND (both sides) and ESP32 GND are all one common ground.</text>
  <line x1="30" y1="640" x2="80" y2="640" stroke="#ef6c00" stroke-width="4" marker-end="url(#arrO)"/>
  <text x="90" y="645" font-size="13" fill="#212121">Data ESP32 → inverter (commands): GPIO17 → TXD … T1OUT → inverter RX.</text>
  <line x1="30" y1="664" x2="80" y2="664" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrG)"/>
  <text x="90" y="669" font-size="13" fill="#212121">Data inverter → ESP32 (answers): inverter TX → R1IN … RXD → GPIO16.</text>
  <text x="1070" y="597" text-anchor="end" font-size="12" fill="#616161">* DB9 pins of the common module with a DB9 socket;</text>
  <text x="1070" y="615" text-anchor="end" font-size="12" fill="#616161">labels differ between sellers.</text>
  <text x="1070" y="645" text-anchor="end" font-size="12" font-weight="700" fill="#c62828">No answer? Swap the orange and green</text>
  <text x="1070" y="663" text-anchor="end" font-size="12" font-weight="700" fill="#c62828">wire on the RS232 side (left of the module).</text>
</svg>
